name: Android release

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'innertube/**'
      - 'native/**'
      - 'native-dsp/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew*'
      - '.github/actions/setup/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Check release version
        id: version
        run: |
          version=$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' app/build.gradle.kts)
          code=$(sed -n 's/^ *versionCode = \([0-9]*\)$/\1/p' app/build.gradle.kts)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || [[ ! "$code" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid Android version"
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          previous=$(gh release list --exclude-pre-releases --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName // empty')
          if gh release view "v$version" >/dev/null 2>&1; then
            if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
              echo "v$version is already published."
              exit 0
            fi
            echo "::error::Increase versionName and versionCode before publishing Android changes."
            exit 1
          fi
          if [ -n "$previous" ]; then
            git fetch --no-tags origin "refs/tags/$previous"
            previous_code=$(git show FETCH_HEAD:app/build.gradle.kts | sed -n 's/^ *versionCode = \([0-9]*\)$/\1/p')
            latest=$(printf '%s\n' "${previous#v}" "$version" | sort -V | tail -n1)
            if [[ ! "$previous_code" =~ ^[0-9]+$ ]] || (( code <= previous_code )) || [ "$latest" != "$version" ]; then
              echo "::error::The Android version must increase from $previous."
              exit 1
            fi
          fi
          echo "build=true" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup
        if: steps.version.outputs.build == 'true'

      - name: Configure release signing
        if: steps.version.outputs.build == 'true'
        env:
          KEYSTORE: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Pulse release signing secrets are missing."
            exit 1
          fi
          umask 077
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/pulse-release.p12"
          {
            echo "storeFile=$RUNNER_TEMP/pulse-release.p12"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build and test
        if: steps.version.outputs.build == 'true'
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease --stacktrace

      - name: Verify APK signatures
        if: steps.version.outputs.build == 'true'
        env:
          EXPECTED_CERT: ${{ secrets.SIGNING_CERT_SHA256 }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if [[ ! "$EXPECTED_CERT" =~ ^[[:xdigit:]]{64}$ ]]; then
            echo "::error::Pulse release certificate digest is missing or invalid."
            exit 1
          fi
          for abi in arm64-v8a armeabi-v7a universal; do
            apk=app/build/outputs/apk/release/app-$abi-release.apk
            certs=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk")
            digest=$(printf '%s\n' "$certs" | sed -n 's/^Signer.*certificate SHA-256 digest: //p')
            if [ "$digest" != "$EXPECTED_CERT" ]; then
              echo "::error::$abi APK certificate differs from the Pulse release certificate."
              exit 1
            fi
            cp "$apk" "pulse-${TAG#v}-$abi.apk"
          done

      - name: Publish GitHub release
        if: steps.version.outputs.build == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          name="pulse-${TAG#v}"
          gh release create "$TAG" "$name-arm64-v8a.apk" "$name-armeabi-v7a.apk" "$name-universal.apk" \
            --target "$GITHUB_SHA" --title "Pulse $TAG" --generate-notes --latest
