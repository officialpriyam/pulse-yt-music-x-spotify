name: Shared Kotlin

on:
  push:
    branches: [main]
    paths:
      - 'multiplatform/**'
      - 'app/src/main/java/dev/priyx/pulse/data/util/SpotifyLinkParser.kt'
      - 'app/src/main/java/dev/priyx/pulse/backend/lyrics/TrackTitle.kt'
      - 'app/src/main/java/dev/priyx/pulse/backend/youtube/Thumbnails.kt'
      - '.github/workflows/multiplatform.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shared-kotlin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Test desktop and compile iOS targets
        run: ./gradlew -p multiplatform desktopTest compileKotlinIosArm64 compileKotlinIosSimulatorArm64
